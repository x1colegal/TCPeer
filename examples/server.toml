# Example only. Only the Secret Key proof is protected; VPN traffic is cleartext.
[coordinator]
# A DNS name, IPv4 address, or IPv6 address is accepted.
address = "coordinator.example.net"
port = 7443

[identity]
network = "home"
peer_id = "main-server"
secret = "replace-this-cleartext-secret"

[direct]
# Set routable or NAT-facing local addresses as appropriate. An empty value
# means that the family is unavailable on this peer.
ipv4 = ""
ipv6 = "2001:db8::10"
port = 7444
# Set this to initiate coordination with a fixed peer after registration.
target_peer = ""

[interface]
name = "tcppeer0"
mtu = 1400

[exit_node]
enabled = true
nat44 = true
nat66 = true
software_flow_offload = true
# Every IPv4 and IPv6 source network arriving through the TUN is forwarded and
# masqueraded automatically; no source-subnet list is required.

[ipv4]
subnet = "10.50.0.0/24"
server = "10.50.0.1"
pool_start = "10.50.0.10"
pool_end = "10.50.0.250"
lease_seconds = 86400

[ipv6]
prefix = "fdfe:cafe:cafe::/64"
server = "fdfe:cafe:cafe::1"
ra_interval_seconds = 30
router_lifetime_seconds = 1800
preferred_lifetime_seconds = 3600
valid_lifetime_seconds = 86400
# Empty means automatic discovery from the active upstream default route.
dns = []

[paths]
state_db = "/var/lib/tcppeer/server/state.db"

[runtime]
log_level = "INFO"
